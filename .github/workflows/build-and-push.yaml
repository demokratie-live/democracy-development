name: Build and Push

on:
  workflow_call:
    inputs:
      changedPackages:
        description: 'Changed Packages'
        required: true
        default: '[]'
        type: string
    secrets:
      DOCKER_USERNAME:
        description: 'Dockerhub Username'
        required: true
      DOCKER_PASSWORD:
        description: 'Dockerhub Token'
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ inputs.changedPackages != '[]'}}
    strategy:
      fail-fast: false
      matrix:
        package: ${{fromJson(inputs.changedPackages)}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Setup package manager
        run: corepack enable
      - run: echo "package=${{ matrix.package }}"
      - name: get directory for package
        id: get-directory
        run: |
          directory=$(pnpm ls -r --json --filter $MATRIX_PACKAGE --changed-files-ignore-pattern="**/(garden.yml|.dockerignore)" | jq -r '.[0] | .path')
          directory="${directory##*/democracy-development/}"

          # Ausgabe
          echo "directory=$directory" >> $GITHUB_OUTPUT
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}

      - run: echo "directory=${{ steps.get-directory.outputs.directory }}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: democracy/${{ matrix.package }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref == format('refs/heads/{0}', 'master') || github.ref == format('refs/heads/{0}', 'alpha') || github.ref == format('refs/heads/{0}', 'internal') }}
            type=ref,event=pr
            type=match,asref=foo,pattern=${{ matrix.package }}@v(\d+.\d+.\d+(?:-alpha.\d+)?),group=1
            type=semver,pattern={{version}},use=foo
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Print Meta Summary
        run: |
          echo "🏷️ Tags: ${{ steps.meta.outputs.tags }}
          " >> $GITHUB_STEP_SUMMARY
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to DockerHub
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Read .node-version
        id: node_version
        run: echo "version=$(cat .node-version | tr -d 'v')" >> $GITHUB_OUTPUT

      - name: Check for service-specific Dockerfile
        id: check-dockerfile
        run: |
          if [ -f "${{ steps.get-directory.outputs.directory }}/Dockerfile" ]; then
            echo "dockerfile=${{ steps.get-directory.outputs.directory }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "dockerfile=infra/Dockerfile" >> $GITHUB_OUTPUT
          fi

      # Ein Image, dem Laufzeit-Module fehlen, faellt erst im Cluster auf.
      # Deshalb zuerst nur amd64 bauen, laden und den Container einmal starten.
      - name: Build for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.check-dockerfile.outputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          target: runner
          tags: smoke-test:${{ matrix.package }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE=${{ matrix.package }}
            SERVICE_PATH=${{ steps.get-directory.outputs.directory }}
            NODE_VERSION=${{ steps.node_version.outputs.version }}

      - name: Smoke test
        run: |
          docker run -d --name smoke-test smoke-test:${{ matrix.package }}
          sleep 30
          docker logs smoke-test > smoke.log 2>&1 || true
          docker rm -f smoke-test > /dev/null 2>&1 || true

          # Ein Dienst, der ohne DB_URL o. ae. abbricht, ist in Ordnung.
          # Ein fehlendes Modul nicht.
          if grep -q "Cannot find module" smoke.log; then
            echo "::error::Dem Image fehlen Laufzeit-Module - es wird nicht gepusht"
            grep -B2 -A8 "Cannot find module" smoke.log | head -40
            exit 1
          fi

          echo "Keine fehlenden Module." >> $GITHUB_STEP_SUMMARY
          head -c 2000 smoke.log

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.check-dockerfile.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.actor != 'dependabot[bot]' }}
          target: runner
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE=${{ matrix.package }}
            SERVICE_PATH=${{ steps.get-directory.outputs.directory }}
            NODE_VERSION=${{ steps.node_version.outputs.version }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
